name: ci

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: Vault lint (0 broken, 0 orphans, 0 duplicates)
        run: python -m gms lint --no-write
      - name: Catalog is in sync with frontmatter
        run: |
          python -m gms sync
          git diff --exit-code -I '^updated: ' -I 'rebuilt from frontmatter by gms sync on' -I 'Generated by `python -m gms sync` on' -- 'brain/00 - Home/index.md' 'brain/00 - Home/brain_index.json'
