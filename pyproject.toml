[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-macro-system"
version = "0.1.0"
description = "Global Macro Brain vault plus the regime and cross-asset engines that keep it live."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gms = "gms.cli:main"

[tool.setuptools.packages.find]
include = ["gms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
